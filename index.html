<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sultan Ahmed Mosque Guide</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #f0f0f0; display: flex; justify-content: center; padding: 10px; }
        .card { background: white; padding: 20px; border-radius: 12px; max-width: 1000px; width: 100%; }
        
        /* The container must be relative so dots stay put */
        .image-wrapper { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            border-radius: 8px; 
            overflow: hidden; 
            background: #000;
            cursor: crosshair; /* Shows you where you are clicking */
        }

        .main-img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        
        .dot {
            position: absolute;
            width: 35px; height: 35px;
            background: #d4af37;
            border: 3px solid white;
            border-radius: 50%;
            cursor: pointer;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        #info-box { margin-top: 20px; padding: 20px; background: #fafafa; border-left: 5px solid #d4af37; min-height: 120px; }
        h2 { margin-bottom: 8px; color: #1d1d1f; }
        p { color: #424245; line-height: 1.5; font-size: 1.1rem; }
        .dev-note { color: red; font-weight: bold; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

<div class="card">
    
    <div class="image-wrapper" id="map-container" onclick="getCoords(event)">
        <img src="https://images.unsplash.com/photo-1541432901042-2d8bd64b4a9b?q=80&w=2000&auto=format&fit=crop" class="main-img">

        <div class="dot" style="top: 20%; left: 8.9%;" onclick="show('The Minarets', 'The Sultan built six minarets to stand out. It was a huge deal because only Mecca had six at the time. To stop people from calling him arrogant, he actually had to pay for a seventh minaret to be built in Mecca.')"></div>

        <div class="dot" style="top: 46.1%; left: 36%;" onclick="show('The Main Dome', 'The dome is 43 meters high. It stays up because of four massive pillars called elephant feet. This setup meant they didn’t need extra walls inside, keeping the prayer hall wide open.')"></div>

        <div class="dot" style="top: 71.9%; left: 42.4%;" onclick="show('Cascading Domes', 'These smaller domes stack up to the main one. It’s an engineering trick to shift the heavy weight of the roof out to the main walls, creating that famous flowing shape.')"></div>

        <div class="dot" style="top: 84.5%; left: 33.4%;" onclick="show('Elephant Feet Pillars', 'These are the giant support columns. They are thick enough to hold the entire weight of the dome. In a building this old, these massive stones are what allow the ceiling to be so high without falling in.')"></div>
    </div>

    <div id="info-box">
        <h2 id="title">Architectural Features</h2>
        <p id="text">Tap the gold markers to see the details.</p>
    </div>
</div>

<script>
    function show(t, txt) {
        // Prevent click from triggering the dev tool
        event.stopPropagation();
        document.getElementById('title').innerText = t;
        document.getElementById('text').innerText = txt;
    }

 //     alert("Top: " + y.toFixed(1) + "% | Left: " + x.toFixed(1) + "%");

</script>

</body>
</html>
